{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OptiProtein{% endblock %} · OptiProtein NG</title>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body data-page="{% block page_key %}{% endblock %}" data-required="{% block required %}{% endblock %}">
  <a class="skip" href="#main">Skip to content</a>

    <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">OP</span>
      <div class="brand-text">
        <div class="brand-name">OptiProtein NG</div>
        <div class="brand-sub">ProExtend-50 market tool</div>
      </div>
    </div>

    <nav class="switch" aria-label="Choose a mode">
      <a href="{% url 'opportunities' %}" class="{% if request.resolver_match.url_name == 'opportunities' %}is-active{% endif %}" {% if request.resolver_match.url_name == 'opportunities' %}aria-current="page"{% endif %}>Plan a launch</a>
      <a href="{% url 'restaurant' %}" class="{% if request.resolver_match.url_name == 'restaurant' %}is-active{% endif %}" {% if request.resolver_match.url_name == 'restaurant' %}aria-current="page"{% endif %}>Cut kitchen costs</a>
      <a href="{% url 'customer' %}" class="{% if request.resolver_match.url_name == 'customer' %}is-active{% endif %}" {% if request.resolver_match.url_name == 'customer' %}aria-current="page"{% endif %}>Find a meal</a>
    </nav>

    <div class="signal-count"><strong id="header-signal-count">{{ total_signals }}</strong> demand signals logged</div>
  </header>

  <div class="stage">
    <section class="brief" aria-label="Describe your situation">
      <form id="brief-form" class="brief-form" autocomplete="off">
        <label for="brief-input" class="brief-label">Describe your situation and we'll fill in the form for you</label>
        <div class="brief-row">
          <input id="brief-input" type="text" placeholder="I run a buka in Surulere, about 300 kg of beef a week, no fridge">
          <button type="button" id="mic-btn" class="btn btn-quiet" aria-label="Speak instead">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 12a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v4a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0m5 5v3" /></svg>
          </button>
          <button type="submit" id="brief-submit" class="btn btn-primary">Fill the form</button>
        </div>
        <div class="brief-examples" id="brief-examples">
          <button type="button" data-example="I run a buka in Surulere, about 300 kg of beef a week, no fridge">Kitchen owner</button>
          <button type="button" data-example="I'm 56 in Ikeja with high blood pressure, under ₦3,000 a meal">Diner</button>
          <button type="button" data-example="Pilot with ₦15m budget, 20 tons a month, beef up 25%">Launch planner</button>
        </div>
        <p id="brief-result" class="brief-result" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <main id="main" class="page">
      {% block content %}{% endblock %}
    </main>
  </div>
    <div class="voice" id="voice" role="dialog" aria-modal="true" aria-labelledby="v-title" hidden>
    <div class="voice-sheet">
      <header class="voice-head">
        <h2 id="v-title">Tell us in your own words</h2>
        <button type="button" id="v-close" class="voice-x" aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" /></svg>
        </button>
      </header>
      <p class="voice-sub" id="v-hint"></p>

      <div class="voice-meter" data-state="idle" id="v-meter">
        <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <span id="v-status" class="voice-status">Ready</span>
        <time id="v-time" class="voice-time">0:00</time>
      </div>

      <label for="v-text" class="sr-only">What you said</label>
      <textarea id="v-text" rows="7" placeholder="Your words appear here as you speak. You can edit them before we fill the form."></textarea>
      <p id="v-interim" class="voice-interim" aria-hidden="true"></p>
      <p id="v-error" class="voice-error" role="alert" hidden></p>

      <footer class="voice-foot">
        <button type="button" id="v-toggle" class="btn btn-quiet">Pause</button>
        <button type="button" id="v-clear" class="btn btn-quiet">Clear</button>
        <span class="spacer"></span>
        <button type="button" id="v-cancel" class="btn btn-quiet">Cancel</button>
        <button type="button" id="v-fill" class="btn btn-primary">Fill the form</button>
      </footer>
    </div>
  </div>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
